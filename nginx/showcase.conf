# Стенд витрин Creatly на общем сервере — отдельный порт (scripts/deploy-showcase.sh подставляет нужный).
# Приложение — контейнер на 127.0.0.1:3100 (docker-compose.showcase.yml); ассеты витрин nginx отдаёт с диска сам.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 80m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # картинки и видео витрин — напрямую с диска (Range для скраба видео, кэш браузера)
    location /uploads/ {
        alias /opt/creatly-showcase/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
